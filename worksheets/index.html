<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Manager · devIndi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Internal tool: each student's latest and next class, paper prompts for Claude, and a class counter with monthly earnings.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230a0a0a%22%2F%3E%3Ccircle%20cx%3D%2229%22%20cy%3D%2238%22%20r%3D%2211%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M40%2014v35%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>body{visibility:hidden;}</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="brand" id="brand" title="All students (Home)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 13h5M9.5 16.5h3"/></svg>
      Class Manager
    </button>
    <div class="spacer"></div>
    <button class="linkbtn" id="historyLink" hidden>History</button>
    <button class="linkbtn" id="classesLink" hidden>Class counter</button>
    <button class="linkbtn" id="refreshLink" title="Re-read the Students folder">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6L20 8.7"/><path d="M20 3.5v5.2h-5.2"/></svg>
      <span>Refresh</span>
    </button>
    <button class="linkbtn" id="themeLink" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
    <button class="linkbtn" id="signOutLink">Sign out</button>
  </header>

  <nav class="trail" id="trail" aria-label="Steps"></nav>
  <main id="main" aria-live="polite"></main>
</div>

<div class="sumbar" id="sumbar" aria-label="Paper summary"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/presets.js"></script>
<script src="js/folder.js"></script>
<script src="js/prompt.js"></script>
<script>
  // The app reads the Students folder through the local server
  // (server/serve.mjs, localhost:4777) on Tushar's laptop, whether the page
  // is opened on devindi.in or served by that server itself.
  // Gate on devindi.in: reuse the same admin session as ../admin — see
  // admin/index.html for what this speed bump does and doesn't protect against.
  // On localhost it's the laptop's own server (bound to 127.0.0.1): no gate.
  const onLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const signOut = document.getElementById('signOutLink');
  if (onLocal) {
    document.body.style.visibility = 'visible';
    signOut.textContent = 'Admin';
    signOut.addEventListener('click', () => { window.location.href = 'https://devindi.in/admin/dashboard.html'; });
  } else {
    if (sessionStorage.getItem('devindi_admin_ok') !== '1') {
      window.location.replace('../admin/index.html');
    } else {
      document.body.style.visibility = 'visible';
    }
    signOut.addEventListener('click', () => {
      sessionStorage.removeItem('devindi_admin_ok');
      window.location.href = '../admin/index.html';
    });
  }
</script>
<script src="js/app.js"></script>
</body>
</html>
