<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in · devIndi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>

<main class="signin">
  <section class="side invert">
    <a class="brand" href="../index.html"><span class="sq"></span>devIndi<span class="tag">Admin</span></a>
    <div>
      <h1>Internal <em>tools.</em></h1>
      <p>Analytics, class management and prototypes for the devIndi team. Not linked from the public site.</p>
    </div>
    <p class="label">devindi.in / admin</p>
  </section>

  <section class="panel">
    <form id="loginForm" autocomplete="off">
      <p class="label" style="margin-bottom:12px">Sign in</p>
      <div class="form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@devindi.in" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign in</button>
      <div class="error" id="errorMsg">Incorrect email or password.</div>
      <a class="back mono" href="../index.html">← Back to devindi.in</a>
    </form>
  </section>
</main>

<script src="../analytics/config.js"></script>
<script src="../analytics/track.js" defer></script>
<script>
  // NOTE for future-Tushar: this is a static site with no server, so this
  // "login" is a UI speed bump, not real access control — the credential
  // check happens entirely in the visitor's browser. It keeps casual
  // visitors out of the admin list, but anyone who reads this file's
  // source (or the public GitHub repo) can see exactly how it works.
  // Don't put anything here you wouldn't want a determined stranger to see.
  const EXPECTED_HASH = 'af6eb2dea0d9f18b3873d5e5270a7288a638fe54681cc2e86b75dc3fd47ba61c';

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking…';

    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const hash = await sha256Hex(email + ':' + password);

    if (hash === EXPECTED_HASH) {
      sessionStorage.setItem('devindi_admin_ok', '1');
      submitBtn.textContent = 'Signing in…';
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      // Log the admin login before leaving the page.
      await Promise.race([
        window.devindiAnalytics ? window.devindiAnalytics.adminLogin() : null,
        wait(3000)
      ]);
      window.location.href = 'dashboard.html';
    } else {
      if (window.devindiAnalytics) window.devindiAnalytics.adminLoginFailed();
      errorMsg.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>

</body>
</html>
