<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet Builder — devIndi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Internal tool: build student-correct paper prompts for Claude from the Students folder.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B4532A' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 3h7l4 4v14H7z'/%3E%3Cpath d='M14 3v4h4'/%3E%3Cpath d='M9.5 13h5M9.5 16.5h3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>body{visibility:hidden;}</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="brand" id="brand" title="All students (Home)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 13h5M9.5 16.5h3"/></svg>
      Worksheet Builder
    </button>
    <div class="spacer"></div>
    <button class="linkbtn" id="historyLink" hidden>History</button>
    <button class="linkbtn" id="refreshLink" title="Re-read the Students folder">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6L20 8.7"/><path d="M20 3.5v5.2h-5.2"/></svg>
      <span>Refresh</span>
    </button>
    <button class="linkbtn" id="themeLink" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
    <button class="linkbtn" id="signOutLink">Sign out</button>
  </header>

  <nav class="trail" id="trail" aria-label="Steps"></nav>
  <main id="main" aria-live="polite"></main>
</div>

<div class="sumbar" id="sumbar" aria-label="Paper summary"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/presets.js"></script>
<script src="js/folder.js"></script>
<script src="js/prompt.js"></script>
<script>
  // The app reads the Students folder through the local server
  // (server/serve.mjs) at localhost:4777. Opened from devindi.in, it hands
  // straight over to that local copy. On localhost it's this laptop's own
  // server (bound to 127.0.0.1), so the devindi admin gate isn't needed.
  const LOCAL = 'http://localhost:4777/';
  const onLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!onLocal) {
    window.location.replace(LOCAL);
  } else {
    document.body.style.visibility = 'visible';
  }
  const signOut = document.getElementById('signOutLink');
  signOut.textContent = 'Admin';
  signOut.addEventListener('click', () => { window.location.href = 'https://devindi.in/admin/dashboard.html'; });
</script>
<script src="js/app.js"></script>
</body>
</html>
